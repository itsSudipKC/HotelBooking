<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New Contact Message</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Segoe UI,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#1d4ed8;padding:24px;text-align:center;">
              <h1 style="color:#ffffff;margin:0;font-size:20px;">New Contact Message</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="color:#374151;font-size:14px;line-height:22px;"><strong>From:</strong> {{name}} ({{email}})</p>
              <p style="color:#374151;font-size:14px;line-height:22px;"><strong>Subject:</strong> {{subject}}</p>
              <p style="color:#374151;font-size:14px;line-height:22px;white-space:pre-wrap;">{{message}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
