<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New Hotel Submission</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Segoe UI,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#dd4128;padding:24px;text-align:center;">
              <h1 style="color:#ffffff;margin:0;font-size:20px;">Hotel Pending Review</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="color:#374151;font-size:14px;line-height:22px;">
                <strong>{{ownerName}}</strong> has {{actionLabel}} <strong>{{hotelName}}</strong> for admin review.
              </p>
              <p style="color:#9ca3af;font-size:12px;">Review it from the admin dashboard's Pending Hotels list.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
